[gcode_macro AFC_BYPASS_TOGGLE]
description: Toggle the AFC virtual bypass on/off
gcode:
    {% set on = printer['filament_switch_sensor virtual_bypass'].enabled %}
    {% if not on and printer.AFC.current_load %}
        RESPOND TYPE=error MSG="Bypass blocked: {printer.AFC.current_load} is loaded. Unload it first."
    {% else %}
        SET_FILAMENT_SENSOR SENSOR=virtual_bypass ENABLE={ 0 if on else 1 }
        RESPOND MSG="AFC virtual bypass {'OFF' if on else 'ON'}"
    {% endif %}


[gcode_macro AFC_QUIET_ON]
description: AFC lane moves quiet: every lane move forced to SPEED mm/s (default 50). Not persistent, resets on restart. SPEED=<10-400>.
gcode:
  AFC_QUIET_MODE ENABLE=1 SPEED={params.SPEED|default(50)|float}

[gcode_macro AFC_QUIET_OFF]
description: AFC lane moves back to normal speeds (long 150 / short 25 mm/s)
gcode:
  AFC_QUIET_MODE ENABLE=0
