[gcode_macro PRINT_START]
gcode:
  # Capture values passed from the slicer: bed temp, extruder temp, chamber temp
  {% set target_bed = params.BED|default("60")|int %}
  {% set target_extruder = params.EXTRUDER|default("220")|int %}
  {% set standby_extruder = 150|float %}
  {% set target_chamber = params.CHAMBER|default("35")|int %}
  {% set initial_tool = params.TOOL|default("0")|int %}

  # Start chamber heating immediately using iHeater system (only if > 0)
  {% if target_chamber > 0 %}
    M117
    M117 Chamber Heater Activated!
    M141 S{target_chamber}                                  # Begin chamber heating with iHeater, proceed during heat up
  {% endif %}

  # Home all axes
  M117
  M117 Homing XYZ axes!
  SET_STEPPER_ENABLE STEPPER=extruder ENABLE=1              # Enable extruder 
  BED_MESH_CLEAR
  # G28                                                     # Home XYZ
  CHOME                                                     # Conditional home XYZ
  AFC_PARK
  M117 Heating up bed and nozzle!
  M140 S{target_bed}                                        # Set bed temp, proceed during heat up
  M117 Loading selected filament!
  T{initial_tool}                                           # Load Initial Tool
  M104 S{standby_extruder}                                  # Set standby extruder temp to reduce oozing
  
  

  # Check if the bed temp is higher than 90c and the chamber is still heat soaked from a prior job
  {% if target_bed > 90 and printer["temperature_sensor Enclosure_Thermistor"].temperature > 40 %}
    {% set mesh_name = "abs-105-amb-50" %}                     # use the ABS mesh 
    M117 Tramming bed and meshing!
    G1 Z75                                                     # move nozzle away
    M106 S255                                                  # Turn on part cooling fans 100% to circulate air
    M106 P2 S25                                                # Turn on auxillary fans 10% to circulate air
    M106 P3 S255                                               # Turn on carbon fans 100% to circulate air
    SET_HEATER_TEMPERATURE HEATER=heater_bed TARGET={target_bed}
    TEMPERATURE_WAIT SENSOR=heater_bed MINIMUM={target_bed}
    {% if target_chamber > 0 %}
      M191 S{target_chamber}                                   # Wait for chamber to reach desired temp using iHeater
    {% endif %}
    G28 Z
    Z_TILT_ADJUST                                              # Z level - Two Z-axis leadscrews
    G28 Z                                                      # Home Z
    BED_MESH_PROFILE LOAD={mesh_name}
    RESPOND PREFIX="BED_MESH" MSG="Loaded mesh: {mesh_name}"
    G90                                                        # Absolute positioning

  # Check if the bed temp is higher than 90c and the chamber is warming from ~22°C ambient
  {% elif target_bed > 90 and printer["temperature_sensor Enclosure_Thermistor"].temperature < 40 %}
    {% set mesh_name = "abs-105-amb-40" %}                     # use the ABS mesh 
    M117 Tramming bed and meshing!
    G1 Z75                                                     # move nozzle away
    M106 S255                                                  # Turn on part cooling fans 100% to circulate air
    M106 P2 S25                                                # Turn on auxillary fans 10% to circulate air
    M106 P3 S255                                               # Turn on carbon fans 100% to circulate air
    SET_HEATER_TEMPERATURE HEATER=heater_bed TARGET={target_bed}
    TEMPERATURE_WAIT SENSOR=heater_bed MINIMUM={target_bed}
    {% if target_chamber > 0 %}
      M191 S{target_chamber}                                   # Wait for chamber to reach desired temp using iHeater
    {% endif %}
    G28 Z
    Z_TILT_ADJUST                                              # Z level - Two Z-axis leadscrews
    G28 Z                                                      # Home Z
    BED_MESH_PROFILE LOAD={mesh_name}
    RESPOND PREFIX="BED_MESH" MSG="Loaded mesh: {mesh_name}"
    G90                                                        # Absolute positioning

  # Check if bed temp is not over 90c and chamber temp is higher - use different mesh since I can't cool quickly
  {% elif target_bed < 90 and printer["temperature_sensor Enclosure_Thermistor"].temperature > 40 %}
    {% set mesh_name = "pla-50-amb-25" %}                      # use the heat soaked PLA mesh
    M117 Tramming bed and meshing!
    G1 Z5
    SET_HEATER_TEMPERATURE HEATER=heater_bed TARGET={target_bed}
    TEMPERATURE_WAIT SENSOR=heater_bed MINIMUM={target_bed}
    G28 Z
    Z_TILT_ADJUST                                              # Z level - Two Z-axis leadscrews
    G28 Z                                                      # Home Z
    BED_MESH_PROFILE LOAD={mesh_name}
    RESPOND PREFIX="BED_MESH" MSG="Loaded mesh: {mesh_name}"
    G90                                                        # Absolute positioning

  # If the bed temp is not over 90c and chamber is cool, heat the bed and then begin
  {% else %}
    {% set mesh_name = "pla-50-amb-25" %}                      # use the low ambient PLA mesh
    M117 Tramming bed and meshing!
    G1 Z5
    SET_HEATER_TEMPERATURE HEATER=heater_bed TARGET={target_bed}
    TEMPERATURE_WAIT SENSOR=heater_bed MINIMUM={target_bed} 
    G28 Z
    Z_TILT_ADJUST                                              # Z level - Two Z-axis leadscrews
    G28 Z                                                      # Home Z
    BED_MESH_PROFILE LOAD={mesh_name}
    RESPOND PREFIX="BED_MESH" MSG="Loaded mesh: {mesh_name}"
    G90                                                        # Absolute positioning    
  {% endif %}

  # --- Z offset: separate macro so the enclosure temp is read now, not at PRINT_START entry ---
  _APPLY_Z_DELTA BED={target_bed} MESH={mesh_name}


  # Heat the nozzle
  M117 Purging filament then job starts!
  SMART_PARK                                                      # KAMP near object start
  M107                                                            # Turn off fans
  SET_HEATER_TEMPERATURE HEATER=extruder TARGET={target_extruder} # Heat the nozzle 
  TEMPERATURE_WAIT SENSOR=extruder MINIMUM={target_extruder}      # Do not wait for PID stabilization, begin ASAP

  # Start printing
  LINE_PURGE                                                    # KAMP 20 mm^3/s in front of object


[gcode_macro PRINT_END]
gcode:

    # Reset any runtime Z offset
    # SET_GCODE_OFFSET Z=0 MOVE=0
    
    # M400                           ; wait for buffer to clear
    G92 E0                         ; zero the extruder
    G1 E-10.0 F3600                ; retract filament far enough to do Diamondback nozzle change while cool
    G91                            ; relative positioning

    #   Get Boundaries
    {% set max_x = printer.configfile.config["stepper_x"]["position_max"]|float %}
    {% set max_y = printer.configfile.config["stepper_y"]["position_max"]|float %}
    {% set max_z = printer.configfile.config["stepper_z"]["position_max"]|float %}

    #   Check end position to determine safe direction to move
    {% if printer.toolhead.position.x < (max_x - 40) %}
        {% set x_safe = 40.0 %}
    {% else %}
        {% set x_safe = -40.0 %}
    {% endif %}

    {% if printer.toolhead.position.y < (max_y - 40) %}
        {% set y_safe = 40.0 %}
    {% else %}
        {% set y_safe = -40.0 %}
    {% endif %}

    {% if printer.toolhead.position.z < (max_z - 100) %}
        {% set z_safe = 100.0 %}
    {% else %}
        {% set z_safe = max_z - printer.toolhead.position.z %}
    {% endif %}

    #   Provide clearance to part
    G0 X{x_safe} Y{y_safe} Z{z_safe} F3600             ; move nozzle to remove stringing
    {% if printer['output_pin unload_at_end'].value == 1 %} # Unload filament from toolhead if option is set in Mainsail
        TOOL_UNLOAD
    {% endif %}
    TURN_OFF_HEATERS
    iHEATER_OFF
    BED_MESH_CLEAR
    # M106 P3 S255                   ; turn ON air filter fan
    G4 P60000                        ; wait for 60s 
    M84                              ; disable motors
    M107                             ; turn OFF air filter fan
    M221 S100                        ; ensure flow rate ends at 100%
    # SET_FAN_SPEED FAN=nevermore_fan SPEED=0   ; release Nevermore override — automatic VOC policy takes over
    M117 Job Complete!              
    SET_STEPPER_ENABLE STEPPER=extruder ENABLE=0     ; disable extruder so its fan shuts off and is quieter




[gcode_macro _APPLY_Z_DELTA]
gcode:
  {% set bed = params.BED|int %}
  {% set mesh_name = params.MESH|default("unknown") %}
  {% set chamber = printer["temperature_sensor Enclosure_Thermistor"].temperature %}
  {% if bed > 90 %}
    {% if chamber > 40 %}
      {% set z_delta = 0.000 %}                                # heat soaked ABS (1.830mm)
    {% else %}
      {% set z_delta = 0.046 %}                                # ABS, lower chamber ambient
    {% endif %}
  {% else %}
    {% if chamber > 40 %}
      {% set z_delta = 0.068 %}                                # heat soaked PLA
    {% else %}
      {% set z_delta = 0.118 %}                                # cool PLA (1.712mm)
    {% endif %}
  {% endif %}
  SET_GCODE_OFFSET Z={z_delta} MOVE=0
  RESPOND PREFIX="Z_OFFSET" MSG="Z delta {z_delta} mm at {chamber|round(1)}C enclosure ({mesh_name})"

  
# [gcode_macro CHOME]
# description: Homes XYZ axis only if printer is in a non-homed state
# gcode:
#   {% if "xyz" not in printer.toolhead.homed_axes %}
#     G28
#   {% endif %}
[gcode_macro CHOME]
description: Homes XYZ only if printer is not homed
gcode:
  {% if "xyz" not in printer.toolhead.homed_axes %}
    ORBITOOL_LED_QUIET_ON
    G4 P150
    G28
    G4 P150
    ORBITOOL_LED_QUIET_OFF
  {% endif %}



[gcode_macro UNLOAD_FILAMENT]
description: Unloads filament from toolhead
gcode:
  {% set EXTRUDER_TEMP = params.TEMP|default(230)|int %}
  G1 Z20                      ; move nozzle away
  M109 S{EXTRUDER_TEMP}       ; heat up the hotend
  M83                         ; set extruder to relative mode
  G1 E-10 F1800               ; quickly retract 10 mm to elimate stringing
  G4 P200                     ; pause for a short amount of time
  G1 E-50 F300                ; retract slowly 50 mm more
  G1 E-20 F300                ; retract slowly 20 mm more  
  M400                        ; wait for moves to finish
  M117 Unload Complete!

[gcode_macro LOAD_FILAMENT]
description: Loads new filament into toolhead
gcode:
  {% set EXTRUDER_TEMP = params.TEMP|default(230)|int %}
  M109 S{EXTRUDER_TEMP}       ; heat up the hotend
  M83                         ; set extruder to relative mode
  G1 E50 F300                 ; extrude slowly
  G1 E50 F300
  M400                        ; wait for moves to finish
  M117 Load Complete!

[gcode_macro CENTER]
description: Moves the toolhead to the center
gcode:
  {% set x_center = printer.toolhead.axis_maximum.x|float / 2.0 %}
  {% set y_center = printer.toolhead.axis_maximum.y|float / 2.0 %}
  G90
  G1 X{x_center} Y{y_center} F7800


[firmware_retraction]
retract_length: 0.75
retract_speed: 60
unretract_extra_length: 0
unretract_speed: 60


[gcode_macro _CLIENT_VARIABLE]
variable_use_custom_pos   : True   ; use custom park coordinates for x,y [True/False]
variable_custom_park_x    : 150.0   ; custom x position; value must be within your defined min and max of X
variable_custom_park_y    : 125.0   ; custom y position; value must be within your defined min and max of Y
variable_custom_park_dz   : 100.0  ; custom dz value; the value in mm to lower the bed when moving to park position
variable_retract          : 1.0    ; the value to retract while PAUSE
variable_cancel_retract   : 10.0   ; the value to retract while CANCEL_PRINT
variable_speed_retract    : 60.0  ; retract speed in mm/s
variable_unretract        : 1.0   ; the value to unretract while RESUME
variable_speed_unretract  : 60.0  ; unretract speed in mm/s
variable_speed_hop        : 20.0  ; z move speed in mm/s
variable_speed_move       : 200.0 ; move speed in mm/s
variable_park_at_cancel   : True ; allow to move the toolhead to park while execute CANCEL_PRINT [True/False]
variable_park_at_cancel_x : 150  ; different park position during CANCEL_PRINT [None/Position as Float]; park_at_cancel must be True
variable_park_at_cancel_y : 50   ; different park position during CANCEL_PRINT [None/Position as Float]; park_at_cancel must be True
# !!! Caution [firmware_retraction] must be defined in the printer.cfg if you set use_fw_retract: True !!!
variable_use_fw_retract   : False  ; use fw_retraction instead of the manual version [True/False]
variable_idle_timeout     : 36000     ; time in sec until idle_timeout kicks in. Value 0 means that no value will be set or restored
variable_runout_sensor    : ""    ; If a sensor is defined, it will be used to cancel the execution of RESUME in case no filament is detected.
#                                   Specify the config name of the runout sensor e.g "filament_switch_sensor runout". Hint use the same as in your printer.cfg
# !!! Custom macros, please use with care and review the section of the corresponding macro.
# These macros are for simple operations like setting a status LED. Please make sure your macro does not interfere with the basic macro functions.
# Only  single line commands are supported, please create a macro if you need more than one command.
variable_user_pause_macro : ""    ; Everything inside the "" will be executed after the klipper base pause (PAUSE_BASE) function
variable_user_resume_macro: ""    ; Everything inside the "" will be executed before the klipper base resume (RESUME_BASE) function
variable_user_cancel_macro: ""    ; Everything inside the "" will be executed before the klipper base cancel (CANCEL_PRINT_BASE) function
gcode:


[gcode_macro BLTOUCH_DEPLOY]
gcode:
  BLTOUCH_DEBUG COMMAND=pin_down

[gcode_macro BLTOUCH_RETRACT]
gcode:
  BLTOUCH_DEBUG COMMAND=pin_up

[gcode_macro update_git]
gcode:
    {% set message = params.MESSAGE|default() %}
    {% if message %}
        RUN_SHELL_COMMAND CMD=update_git_script_message PARAMS="'{params.MESSAGE}'"
    {% else %}
        RUN_SHELL_COMMAND CMD=update_git_script
    {% endif %}

[gcode_shell_command update_git_script]
command: bash -c "bash $HOME/klipper-backup/script.sh"
timeout: 90.0
verbose: True

[gcode_shell_command update_git_script_message]
command: bash -c "bash $HOME/klipper-backup/script.sh -c $0"
timeout: 90.0
verbose: True

[pause_resume]

[gcode_macro PAUSE]
rename_existing: BASE_PAUSE
description: Safe pause that tolerates filament unload/reload
gcode:
    {% set zhop = params.Z|default(10)|float %}
    {% set retract = params.E|default(1.0)|float %}
    {% set client = printer['gcode_macro _CLIENT_VARIABLE']|default({}) %}
    {% set park_x = client.park_x|default(150)|float %}
    {% set park_y = client.park_y|default(125)|float %}

    {% if not printer.pause_resume.is_paused %}
        SAVE_GCODE_STATE NAME=PAUSE_STATE

        ; record idle timeout
        SET_GCODE_VARIABLE MACRO=RESUME VARIABLE=restore_idle_timeout VALUE={printer.configfile.settings.idle_timeout.timeout}
        SET_IDLE_TIMEOUT TIMEOUT=72000

        ; retract a little if hot
        {% if printer.extruder.can_extrude %}
            G91
            G1 E-{retract} F2100
            G90
            SET_GCODE_VARIABLE MACRO=RESUME VARIABLE=etemp VALUE={printer.extruder.target}
        {% endif %}

        ; perform Z-hop if safe
        {% set cur_z = printer.toolhead.position.z %}
        {% set max_z = printer.toolhead.axis_maximum.z %}
        {% if cur_z + zhop < max_z %}
            G91
            G1 Z{zhop} F900
            G90
            SET_GCODE_VARIABLE MACRO=RESUME VARIABLE=zhop VALUE={zhop}
        {% else %}
            SET_GCODE_VARIABLE MACRO=RESUME VARIABLE=zhop VALUE=0
        {% endif %}

        ; park head
        SAVE_GCODE_STATE NAME=PAUSE_PARK
        _TOOLHEAD_PARK_PAUSE_CANCEL X={park_x} Y={park_y}

        BASE_PAUSE
    {% endif %}

[gcode_macro RESUME]
rename_existing: BASE_RESUME
description: Safe resume tolerant of unload/load and Z rehome
variable_zhop: 0
variable_etemp: 0
variable_restore_idle_timeout: 0
gcode:
    {% set e = params.E|default(1.0)|float %}
    {% set zhop = zhop|float %}
    {% set etemp = etemp|float %}

    {% if printer.pause_resume.is_paused %}
        ; restore idle timeout
        {% if printer['gcode_macro RESUME'].restore_idle_timeout|default(0)|int > 0 %}
            SET_IDLE_TIMEOUT TIMEOUT={printer['gcode_macro RESUME'].restore_idle_timeout}
        {% else %}
            SET_IDLE_TIMEOUT TIMEOUT={printer.configfile.settings.idle_timeout.timeout}
        {% endif %}

        ; reheat if needed
        {% if etemp > 0 %}
            SET_HEATER_TEMPERATURE HEATER=extruder TARGET={etemp|int}
            TEMPERATURE_WAIT SENSOR=extruder MINIMUM={etemp|int}
        {% endif %}

        ; --- SAFE Z RESTORE ---
        {% set cur_z = printer.toolhead.position.z %}
        {% set target_z = cur_z - zhop %}
        {% if zhop > 0 %}
            {% if target_z < 0 %}
                { action_respond_info("Skipping unsafe Z restore (would go below bed)") }
            {% else %}
                G91
                G1 Z{0 - zhop} F900
                G90
            {% endif %}
        {% endif %}

        ; --- RESTORE XY IF SAFE ---
        {% if printer.toolhead.homed_axes|lower == 'xyz' %}
            {% set park_x = printer.toolhead.position.x %}
            {% set park_y = printer.toolhead.position.y %}
            { action_respond_info("Resuming from parked position X%.1f Y%.1f Z%.1f" % (park_x, park_y, printer.toolhead.position.z)) }
        {% else %}
            { action_respond_info("Axes not homed, skipping XY restore") }
        {% endif %}

        M83
        {% if printer.extruder.can_extrude %}
            G1 E{e} F900
        {% endif %}

        BASE_RESUME
    {% endif %}

[gcode_macro CANCEL_PRINT]
description: Safe cancel compatible with robust pause/resume
rename_existing: BASE_CANCEL_PRINT
gcode:
  ##### user parameters or defaults #####
  {% set client   = printer['gcode_macro _CLIENT_VARIABLE']|default({}) %}
  {% set allow_park = client.park_at_cancel|default(true)|lower == 'true' %}
  {% set retract  = client.cancel_retract|default(10.0)|abs %}

  ##### define safe park position #####
  {% set park_x   = client.park_at_cancel_x|default(150)|float %}
  {% set park_y   = client.park_at_cancel_y|default(125)|float %}
  {% set cur_z    = printer.toolhead.position.z %}
  {% set max_z    = printer.toolhead.axis_maximum.z %}

  ##### clear resume variables #####
  SET_GCODE_VARIABLE MACRO=RESUME VARIABLE=zhop VALUE=0
  SET_GCODE_VARIABLE MACRO=RESUME VARIABLE=etemp VALUE=0

  ##### restore idle_timeout #####
  {% if printer['gcode_macro RESUME'].restore_idle_timeout|default(0)|int > 0 %}
    SET_IDLE_TIMEOUT TIMEOUT={printer['gcode_macro RESUME'].restore_idle_timeout}
  {% else %}
    SET_IDLE_TIMEOUT TIMEOUT={printer.configfile.settings.idle_timeout.timeout}
  {% endif %}

  ##### park safely #####
  {% if allow_park %}
    {% if cur_z + 5 < max_z %}
      G91
      G1 Z5 F900
      G90
    {% endif %}
    _TOOLHEAD_PARK_PAUSE_CANCEL X={park_x} Y={park_y}
  {% endif %}

  ##### retract filament #####
  _CLIENT_RETRACT LENGTH={retract}

  ##### user-defined cancel actions #####
  {client.user_cancel_macro|default("")}

  ##### reset pause macros #####
  SET_PAUSE_NEXT_LAYER ENABLE=0
  SET_PAUSE_AT_LAYER ENABLE=0 LAYER=0

  ##### shutdown heaters, fans, mesh, display #####
  M107
  TURN_OFF_HEATERS
  iHEATER_OFF
  M221 S100
  BED_MESH_CLEAR
  # SET_FAN_SPEED FAN=nevermore_fan SPEED=0   ; release Nevermore override — automatic VOC policy takes over
  M117 Cancelled!
  BASE_CANCEL_PRINT

[gcode_macro M600]
gcode:
    {% set X = params.X|default(50)|float %}
    {% set Y = params.Y|default(50)|float %}
    {% set Z = params.Z|default(10)|float %}
    SAVE_GCODE_STATE NAME=M600_state
    PAUSE
    G91
    G1 E-.8 F2700
    G1 Z{Z}
    G90
    G1 X{X} Y{Y} F3000
    G91
    G1 E-50 F1000
    RESTORE_GCODE_STATE NAME=M600_state


[gcode_macro REPORT_FLOW]
gcode:
  RESPOND PREFIX="FLOW" MSG="Extrude factor = { printer.gcode_move.extrude_factor }"

[gcode_macro ORBITOOL_LED_QUIET_ON]
gcode:
  SET_LED LED=OrbiLED RED=0 GREEN=0 BLUE=0 TRANSMIT=1

[gcode_macro ORBITOOL_LED_QUIET_OFF]
gcode:
  SET_LED LED=OrbiLED RED=0 GREEN=0 BLUE=0.1 TRANSMIT=1

[gcode_macro HOME_Z_QUIET]
gcode:
  AFC_QUIET_ON
  ORBITOOL_LED_QUIET_ON
  G4 P100                    # 100ms settle (important)
  G28 Z
  G4 P100
  ORBITOOL_LED_QUIET_OFF
  AFC_QUIET_OFF


