samples: 3
samples_result: median
samples_tolerance: 0.08
samples_tolerance_retries: 5
speed: 10.0

[bed_mesh]
speed: 100
horizontal_move_z: 5
mesh_min: 25,20
mesh_max: 265,210
probe_count: 7,7
mesh_pps: 2,2
zero_reference_position: 150,125
fade_start: 1
fade_end: 5
fade_target: 0
algorithm: bicubic
bicubic_tension: 0.4
split_delta_z: 0.025

[z_tilt]
z_positions:
  -60,5
  360,5
points:
  45,125
  295,125
retries: 6
speed: 100                 
horizontal_move_z: 10       
retry_tolerance: 0.01


[bed_screws]
screw1: 20, 20
screw1_name: front left screw
screw2: 280, 20
screw2_name: front right screw
screw3: 150, 220
screw3_name: back screw

[screws_tilt_adjust]
screw1: 48,20    # account for BL-Touch x-offset
screw1_name: front left screw
screw2: 300, 20    # NOT 308 (=280+28): X>300 crashes toolhead into Y1 rail/enclosure. Probes 8mm inboard of screw by design.
screw2_name: front right screw
screw3: 178, 220
screw3_name: rear center screw
horizontal_move_z: 10.0
speed: 50.0
screw_thread: CW-M4

# [safe_z_home] disabled in favor of [homing_override] below for multi-sample Z homing.
# Original block preserved as comments for easy revert.
# [safe_z_home]
# home_xy_position: 150, 125 
# speed: 50
# z_hop_speed: 5

# Multi-sample Z homing override.
# Default Z homing is single-touch and ignores [bltouch] samples settings,
# which causes erratic z-offset in elevated chamber temps. This override:
#   1. Homes X and Y
#   2. Parks nozzle at (178, 125) so the probe sits at bed center (150, 125)
#   3. Does one rough G28 Z to establish a Z reference (2 touch)
#   4. Lifts to Z=10 for clearance
#   5. Runs PROBE with samples=3, median, retries=3
#   6. _APPLY_Z_DATUM anchors Z to the PROBE median (not the last sample)

[homing_override]
axes: z
set_position_z: 0
gcode:
  {% set home_all = 'X' not in params and 'Y' not in params and 'Z' not in params %}

  {% if home_all or 'X' in params %}
    G28 X
  {% endif %}

  {% if home_all or 'Y' in params %}
    G28 Y
  {% endif %}

  {% if home_all or 'Z' in params %}
    G90
    G0 X178 Y125 F6000    # X178 puts probe (x_offset -28) at bed center 150,125
    G28 Z
    G0 Z10 F600
    PROBE SAMPLES=3 SAMPLES_RESULT=median SAMPLES_TOLERANCE=0.08 SAMPLES_TOLERANCE_RETRIES=1
    _APPLY_Z_DATUM
    G0 Z10 F600
  {% endif %}

# Applies the true Z datum after the multi-sample PROBE in [homing_override].
# Separate macro by necessity: Klipper renders a macro's entire template before
# running any line, so probe.last_z_result read inside the override would be stale.
[gcode_macro _APPLY_Z_DATUM]
description: Anchor Z to the PROBE median instead of the last sample
gcode:
    {% set zo   = printer.configfile.settings.bltouch.z_offset|float %}
    {% set last = printer.toolhead.position.z|float %}
    {% set med  = printer.probe.last_z_result|float %}
    SET_KINEMATIC_POSITION Z={ zo + last - med }


[z_thermal_adjust]
# compensates for frame/enclosure expansion during extended high temperature prints
# as thermal time constant is long. Does NOT compensate for Z_Offset at the 
# start of a print. 
temp_coeff: 0.00625
#   The temperature coefficient of expansion, in mm/degC. For example, a
#   temp_coeff of 0.01 mm/degC will move the Z axis downwards by 0.01 mm for
#   every degree Celsius that the temperature sensor increases. Defaults to
#   0.0 mm/degC, which applies no adjustment.
smooth_time: 10
#   Smoothing window applied to the temperature sensor, in seconds. Can reduce
#   motor noise from excessive small corrections in response to sensor noise.
#   The default is 2.0 seconds.
z_adjust_off_above: 99999999.0
#   Disables adjustments above this Z height [mm]. The last computed correction
#   will remain applied until the toolhead moves below the specified Z height
#   again. The default is 99999999.0 mm (always on).
# Safety rail, not a tuning value: measured total warm-up drift was 0.42 mm,
# while a normal in-print correction is under 0.07 mm. Bounds a runaway if the
# sensor misreads or delta_t goes far outside the fitted range.
max_z_adjustment: 0.15
#   Maximum absolute adjustment that can be applied to the Z axis [mm]. The
#   default is 99999999.0 mm (unlimited).
sensor_type: temperature_combined
sensor_list: temperature_sensor Enclosure_Thermistor
combination_method: mean
maximum_deviation: 999
min_temp: 0
max_temp: 100
gcode_id: frame_th



