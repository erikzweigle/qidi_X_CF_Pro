[include mainsail.cfg]

[mcu]
serial: /dev/serial/by-id/usb-Klipper_stm32h723xx_XCF-PRO-if00

[printer]
kinematics: cartesian
max_velocity: 500
max_accel: 30000
max_z_velocity: 15
max_z_accel: 100
square_corner_velocity: 5
minimum_cruise_ratio: 0.5

[exclude_object]
[include OrbitoolO2.cfg]
[include KAMP_Settings.cfg]
[include macros.cfg]
[include aux_fan.cfg]
[include shell_command.cfg]
[gcode_arcs]
resolution: 0.005
[include timelapse.cfg]
[include fan_tach_monitor.cfg]
[include nevermore.cfg]
[include AFC/*.cfg]
[include iHeater.cfg]
[include filament_runout_consume.cfg]   # must load after AFC


[virtual_pins]
[output_pin unload_at_end]
pin: virtual_pin:unload_at_end_pin

[virtual_sdcard]
path: /home/qidi/printer_data/gcodes
on_error_gcode: CANCEL_PRINT



###########################################################################################
###################################### Motor's config #####################################
###########################################################################################

# Motor8, M8P-M8
[stepper_x]
step_pin: PC7
dir_pin: PC8
enable_pin: !PD2
microsteps: 64     # 32/200/64=0.0025 mm X resolution
rotation_distance: 32     # 2mm belt pitch * 16T GT2 Pulley  = 32
full_steps_per_rotation: 200   # LDO Motors 42STH48-2504AH NEMA 17
endstop_pin: !PC15
position_endstop: 301
position_max: 303
position_min: 0
homing_speed: 50
second_homing_speed: 5

[tmc5160 stepper_x]
cs_pin: PC6   # Motor 8, TMC5160
spi_software_mosi_pin: PG6
spi_software_miso_pin: PG7
spi_software_sclk_pin: PG8
interpolate: true
run_current: 1.5  # 2.5A*0.707*80%=1.4 A
stealthchop_threshold: 0 #stealthchop 999999

# Motor6, M8P-M6
[stepper_y]
step_pin: PG9
dir_pin: PD7
enable_pin: !PG11
microsteps: 64     # 40/200/32=0.003125 mm Y resolution
rotation_distance: 40     # 2mm belt pitch * 20T GT2 Pulley
full_steps_per_rotation: 200  # LDO Motors 42STH48-2504AH NEMA 17
endstop_pin: !PF1
position_endstop: 0
position_min: -1
position_max: 239
homing_speed: 50
second_homing_speed: 5

[tmc5160 stepper_y]
cs_pin: PG10   # Motor 6, TMC5160
spi_software_mosi_pin: PG6
spi_software_miso_pin: PG7
spi_software_sclk_pin: PG8
interpolate: true
run_current: 1.5
stealthchop_threshold: 0 #stealthchop 999999

# Motor7, M8P-M7
[stepper_y1]
step_pin: PD4
dir_pin: !PD3
enable_pin: !PD6
microsteps: 64     # 40/200/64=0.003125 mm Y1 resolution
rotation_distance: 40     # 2mm belt pitch * 20T GT2 Pulley
full_steps_per_rotation: 200   # LDO Motors 42STH48-2504AH NEMA 17

[tmc5160 stepper_y1]
